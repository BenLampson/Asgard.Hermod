name: Release MSIX

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # 只有仓库所有者发布的 Release 才能触发打包；重新运行也必须由所有者执行。
    if: >-
      github.event.release.author.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      # 使用内置令牌向已发布的 Release 上传安装包，无需个人访问令牌。
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw 'Release tags must use vMajor.Minor.Patch, for example v0.1.1.'
          }
          $packageVersion = $env:RELEASE_TAG.Substring(1) + '.0'
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build Asgard.Hermod.slnx -c Release

      - name: Verify formatting
        run: dotnet format Asgard.Hermod.slnx --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test --solution Asgard.Hermod.slnx --configuration Release --no-build

      - name: Build x64 MSIX
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          & ./packaging/Asgard.Hermod/Build-Msix.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: Asgard.Hermod_${{ steps.version.outputs.package_version }}_x64
          path: artifacts/msix/*.msix
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach MSIX to published Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $packagePath = "artifacts/msix/Asgard.Hermod_$($env:PACKAGE_VERSION)_x64.msix"
          gh release upload $env:RELEASE_TAG $packagePath --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
