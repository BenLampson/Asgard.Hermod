name: Release MSIX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag from main, for example v1.0.1'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release after all checks pass'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hermod-release-main
  cancel-in-progress: false

jobs:
  package:
    # 仅允许所有者从 main 手动发布；环境规则另行限制分支，避免误选 dev。
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    environment: release
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      # 内置令牌管理 Release；受 main 环境限制的专用部署密钥负责创建标签。
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify main source and resolve package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          $packageVersion = & ./tools/Test-ReleaseSource.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -RequireNewTag:($env:PUBLISH_RELEASE -eq 'true')
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Verify server release boundary
        run: ./tools/Test-ServerReleasePolicy.ps1

      - name: Build solution
        run: dotnet build Asgard.Hermod.slnx -c Release

      - name: Verify formatting
        run: dotnet format Asgard.Hermod.slnx --verify-no-changes --no-restore

      - name: Run tests
        # 原生窗口布局需要足够大的交互桌面，不能依赖托管镜像的默认小分辨率。
        run: |
          & ./tools/Initialize-DesktopTestEnvironment.ps1
          dotnet test --solution Asgard.Hermod.slnx --configuration Release --no-build --max-parallel-test-modules 1

      - name: Build x64 MSIX
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          & ./packaging/Asgard.Hermod/Build-Msix.ps1 -PackageVersion $env:PACKAGE_VERSION

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: Asgard.Hermod_${{ steps.version.outputs.package_version }}_x64
          path: artifacts/msix/*.msix
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Configure main-only release tag credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # 保留刚生成的安装包；凭据由官方 checkout 在作业结束时清理。
          clean: false
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          persist-credentials: true

      - name: Verify release key without creating a tag
        if: ${{ !inputs.publish }}
        run: |
          $probeRef = "refs/tags/release-access-check-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git push --dry-run origin "$($env:GITHUB_SHA):$probeRef"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag credentials could not be verified.' }

      - name: Publish Release from verified main commit
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          # 打包期间 main 可能前进；再次确认该提交仍属于 main，且不覆盖已有版本。
          & ./tools/Test-ReleaseSource.ps1 -ReleaseTag $env:RELEASE_TAG -RequireNewTag | Out-Null
          $packagePath = "artifacts/msix/Asgard.Hermod_$($env:PACKAGE_VERSION)_x64.msix"
          git push origin "$($env:GITHUB_SHA):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed.' }
          gh release create $env:RELEASE_TAG $packagePath `
            --verify-tag --target $env:GITHUB_SHA --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
